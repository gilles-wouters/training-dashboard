name: Update training data

on:
  schedule:
    # GitHub cron is always UTC and has no timezone setting, so there are two
    # entries: one for Brussels summer time (UTC+2), one for winter (UTC+1).
    # Both fire year-round, which just means a harmless second run each day.
    - cron: "30 6 * * *" # 08:30 Brussels, late March to late October
    - cron: "30 7 * * *" # 08:30 Brussels, late October to late March
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch from intervals.icu
        env:
          ICU_ATHLETE_ID: ${{ secrets.ICU_ATHLETE_ID }}
          ICU_API_KEY: ${{ secrets.ICU_API_KEY }}
        run: node fetch.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "training-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update training data"
          git push
